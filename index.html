
<!-- LIVE STOCK MARKET -->
<section class="container">
    <h2 class="section-title">
        Live Stock Market Data
    </h2>

    <div class="card">
        <select id="stockSymbol"
            style="width:100%;padding:12px;margin-bottom:12px;">
            <option value="TCS">TCS</option>
            <option value="INFY">Infosys</option>
            <option value="RELIANCE">Reliance</option>
            <option value="HDFCBANK">HDFC Bank</option>
            <option value="ICICIBANK">ICICI Bank</option>
            <option value="SBIN">SBI</option>
        </select>

        <select id="period"
            style="width:100%;padding:12px;margin-bottom:12px;">
            <option value="1mo">1 Month</option>
            <option value="3mo">3 Months</option>
            <option value="6mo">6 Months</option>
            <option value="1y">1 Year</option>
            <option value="2y">2 Years</option>
        </select>

        <button onclick="loadStock()"
            style="padding:12px;background:#1677ff;
            color:white;border:0;border-radius:8px;width:100%;">
            Get Stock Price
        </button>

        <div id="stockResult" style="margin-top:20px;">
            Select a company to view stock data.
        </div>
    </div>
</section>

<script>
const API_URL =
"https://stock-market-analysis-backend-3.onrender.com";

async function loadStock() {
    const symbol =
        document.getElementById("stockSymbol").value;

    const period =
        document.getElementById("period").value;

    const result =
        document.getElementById("stockResult");

    result.textContent = "Loading stock data...";

    try {
        const response = await fetch(
            `${API_URL}/api/stock/${symbol}?period=${period}`
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Data not available");
        }

        result.innerHTML = `
            <h3>${data.name || data.symbol}</h3>
            <h2 style="color:green;margin:15px 0;">
                ₹${Number(data.latest_price).toLocaleString("en-IN")}
            </h2>
            <p>Symbol: ${data.symbol}</p>
            <p>Period: ${data.period}</p>
            <p>Records: ${data.count}</p>
            <p>Source: ${data.data_type}</p>
        `;

    } catch (error) {
        result.textContent = "Error: " + error.message;
    }
}
</script>
